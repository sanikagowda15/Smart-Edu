<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registration - Smart Edu</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            margin: 0;
        }

        header {
            background-color: #1f4e79;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 400px;
            max-width: 90%;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow:
                0 3px 10px
                rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #1f4e79;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #1f4e79;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #1f4e79;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #163a5c;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            color: #b00020;
            background-color: #ffe6e6;
            font-size: 14px;
        }

        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .login-link a {
            color: #1f4e79;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

<header>

    <h1>Smart Edu</h1>

</header>


<div class="container">

    <h2>Create Account</h2>


    {% if message %}

        <div class="message">
            {{ message }}
        </div>

    {% endif %}


    <form method="POST">

        <!-- NAME -->

        <label for="name">
            Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            value="{{ request.form.get('name', '') }}"
            placeholder="Rahul Kumar"
            required
        >

        <div class="hint">
            Example: Rahul Kumar
        </div>


        <!-- EMAIL -->

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            value="{{ request.form.get('email', '') }}"
            placeholder="student@gmail.com"
            required
        >

        <div class="hint">
            Example: student@gmail.com
        </div>


        <!-- PASSWORD -->

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="SmartEdu@123"
            required
        >

        <div class="hint">
            Minimum 8 characters with uppercase,
            lowercase, number and special character.
        </div>


        <button type="submit">
            Register
        </button>

    </form>


    <div class="login-link">

        Already have an account?

        <a href="/login">
            Login
        </a>

    </div>

</div>

</body>

</html>
